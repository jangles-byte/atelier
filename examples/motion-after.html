<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion — after</title>
<style>
  /* ============================================================
     STATIC DESIGN — byte-identical to motion-before.html.
     The only difference between these two files is the MOTION
     block at the bottom. Same pixels, different life.
     ============================================================ */
  :root {
    --bg: oklch(17% 0.012 265); --raised: oklch(21% 0.014 265);
    --text: oklch(93% 0.008 265); --muted: oklch(68% 0.012 265);
    --border: oklch(30% 0.016 265); --accent: oklch(72% 0.15 265);
    --ink: oklch(16% 0.02 265); --ok: oklch(75% 0.12 150);
    --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    color-scheme: dark;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.5 "Inter", system-ui, sans-serif; padding: var(--s6); }
  .app { max-width: 560px; margin: 0 auto; }
  header { display:flex; align-items:center; justify-content:space-between;
    padding-bottom: var(--s4); border-bottom: 1px solid var(--border); }
  h1 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .live { display:flex; align-items:center; gap: var(--s2);
    font-size: 12.5px; color: var(--muted); }
  .dot { width:7px; height:7px; border-radius:50%; background: var(--ok); }
  .btn { font: 600 14px "Inter", system-ui, sans-serif; height: 38px;
    padding: 0 var(--s4); border-radius: 6px; background: var(--accent);
    color: var(--ink); border: none; cursor: pointer; }
  .list { list-style:none; margin-top: var(--s5);
    display:flex; flex-direction:column; gap: var(--s3); }
  .card { position: relative; background: var(--raised);
    border: 1px solid var(--border); border-radius: 8px;
    padding: var(--s4); cursor: pointer; }
  .card h3 { font-size: 14.5px; font-weight: 600; }
  .card p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .card .tag { position:absolute; top: var(--s4); right: var(--s4);
    font: 500 11.5px ui-monospace, monospace; color: var(--muted); }
  .panel { position: fixed; inset: 0; display: grid; place-items: center;
    background: oklch(10% 0.01 265 / 0.6); }
  .panel .sheet { width: min(420px, 90vw); background: var(--raised);
    border: 1px solid var(--border); border-radius: 10px; padding: var(--s5); }
  .panel h2 { font-size: 17px; font-weight: 650; }
  .panel p { color: var(--muted); font-size: 13.5px; margin-top: var(--s2); }
  .panel .close { margin-top: var(--s5); }
  .hidden { display: none; }

  /* ============================================================
     MOTION — the "after". Diagnostic §1–§11 applied.
     ============================================================ */
  :root {
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);      /* §1 decisive arrival */
    --ease-in:  cubic-bezier(0.55, 0, 1, 0.45);      /* §1 departures accelerate */
    --ease-back:cubic-bezier(0.34, 1.56, 0.64, 1);   /* §4 ~10% overshoot, ζ≈0.6 feel */
    --t-micro: 130ms;    /* §2 duration scale by weight */
    --t-card:  260ms;
    --t-panel: 380ms;
  }
  /* §6 transform+opacity only — never `all`, never layout properties */
  .card {
    transform: translateY(0) scale(1); opacity: 1;
    transition: transform var(--t-card) var(--ease-out),
                opacity   var(--t-card) var(--ease-out),
                border-color var(--t-micro) var(--ease-out);
  }
  .card.enter { transform: translateY(14px) scale(0.985); opacity: 0; }
  /* §6 hover composes three channels instead of dimming opacity */
  .card:hover { transform: translateY(-2px) scale(1.006);
                border-color: oklch(45% 0.06 265); }
  /* §4 press: brief compress, released through an overshoot curve */
  .card:active { transform: translateY(0) scale(0.984);
                 transition-duration: 90ms; }
  .btn { transition: transform var(--t-micro) var(--ease-back),
                     background-color var(--t-micro) var(--ease-out); }
  .btn:hover  { background: oklch(80% 0.14 265); }
  .btn:active { transform: scale(0.96); transition-duration: 80ms; }

  /* §7/§8 panel: has an entrance, an exit, and an origin at the tap point */
  .panel { transition: opacity var(--t-panel) var(--ease-out); }
  .panel .sheet {
    transition: transform var(--t-panel) var(--ease-out),
                opacity   var(--t-panel) var(--ease-out);
  }
  .panel.closing { transition-duration: calc(var(--t-panel) * 0.8);   /* §2 exits ~20% faster */
                   transition-timing-function: var(--ease-in); }
  .panel.closing .sheet { transition-timing-function: var(--ease-in);
                          transition-duration: calc(var(--t-panel) * 0.8); }
  .panel.shut { opacity: 0; }
  .panel.shut .sheet { transform: scale(0.94) translateY(6px); opacity: 0; }

  /* §11 ambient: declarative, so the compositor owns it and the browser
     throttles it off-screen and in background tabs — no permanent rAF. */
  .dot { animation: pulse 2.4s var(--ease-out) infinite; will-change: opacity; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.45 } }

  /* Reduced motion: complete and calm, not merely disabled.
     Feedback (color, opacity) survives; travel, scale and ambient do not. */
  @media (prefers-reduced-motion: reduce) {
    .card, .btn, .panel, .panel .sheet {
      transition-property: opacity, background-color, border-color;
      transition-duration: 120ms;
    }
    .card.enter { transform: none; }
    .card:hover, .card:active, .btn:active { transform: none; }
    .panel.shut .sheet { transform: none; }
    .dot { animation: none; }
  }
</style></head>
<body>
<div class="app">
  <header>
    <h1>Deploy queue</h1>
    <span class="live"><span class="dot" id="dot"></span>live</span>
  </header>
  <button class="btn" id="run" style="margin-top:24px">Load queue</button>
  <ul class="list" id="list"></ul>
</div>

<div class="panel hidden shut" id="panel">
  <div class="sheet">
    <h2 id="ptitle">payments-service</h2>
    <p>Build 4127 · queued behind 2 jobs · estimated 3m 40s remaining.</p>
    <button class="btn close" id="close">Close</button>
  </div>
</div>

<script>
const ITEMS = [
  ["payments-service", "staging → prod", "4127"],
  ["auth-gateway", "canary 10%", "4126"],
  ["search-indexer", "rebuild shards", "4125"],
  ["web-frontend", "assets + SSR", "4124"],
  ["notifier", "hotfix", "4123"],
];
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const list = document.getElementById("list");

function render() {
  list.innerHTML = "";
  ITEMS.forEach(([t, s, n], i) => {
    const li = document.createElement("li");
    li.className = "card enter";
    li.innerHTML = `<h3>${t}</h3><p>${s}</p><span class="tag">#${n}</span>`;
    li.onclick = e => openPanel(t, e.currentTarget);
    // §3 stagger, capped so the whole group lands inside ~450ms
    li.style.transitionDelay = reduced.matches ? "0ms"
      : `${Math.min(i, 8) * 40}ms`;
    list.appendChild(li);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".card").forEach(c => c.classList.remove("enter"));
  }));
}
document.getElementById("run").onclick = render;

// §8 causality: the sheet grows from wherever the user actually clicked
const panel = document.getElementById("panel");
const sheet = panel.querySelector(".sheet");
let closeTimer;
function openPanel(title, origin) {
  clearTimeout(closeTimer);                       // §9 interruptible: cancel a pending close
  document.getElementById("ptitle").textContent = title;
  if (origin && !reduced.matches) {
    const r = origin.getBoundingClientRect();
    sheet.style.transformOrigin =
      `${r.left + r.width / 2}px ${r.top + r.height / 2}px`;
  }
  panel.classList.remove("hidden", "closing");
  requestAnimationFrame(() => panel.classList.remove("shut"));
}
function closePanel() {
  panel.classList.add("closing", "shut");         // §7 a real exit, accelerating away
  closeTimer = setTimeout(() => panel.classList.add("hidden"),
    reduced.matches ? 120 : 380 * 0.8);
}
document.getElementById("close").onclick = closePanel;
panel.onclick = e => { if (e.target === panel) closePanel(); };
render();
</script>
</body></html>
