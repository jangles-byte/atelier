<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Game feel — built from recipes-procedural.md</title>
<style>
  body { margin:0; background: oklch(15% 0.012 265); display:grid; place-items:center;
    height:100vh; font: 13px/1 ui-monospace, monospace; color: oklch(62% 0.012 265); }
  .stage { position:relative; }
  canvas { display:block; border-radius:10px; background: oklch(18% 0.014 265); }
  .cap { margin-top:14px; text-align:center; letter-spacing:0.02em; }
  .cap b { color: oklch(78% 0.14 60); font-weight:600; }
</style></head><body>
<div class="stage">
  <canvas id="c" width="640" height="380"></canvas>
  <div class="cap">hit-stop <b>70ms</b> · trauma <b>0.75</b> (shake ∝ trauma²) · <b>28</b> pooled particles</div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// --- smooth value noise: coherent, so shake reads as force not as a bug ---
const perm = Array.from({length:256}, (_,i)=>i).sort(()=>Math.random()-0.5);
const fade = t => t*t*(3-2*t);
function noise(x){ const i=Math.floor(x), f=x-i;
  const a=perm[i&255]/255, b=perm[(i+1)&255]/255; return a+(b-a)*fade(f); }

// --- particle pool: never allocate in the hot loop (recipes-procedural §3) ---
const P = Array.from({length:256}, () => ({alive:false,x:0,y:0,vx:0,vy:0,life:0,max:1,r:0,hue:0}));
function emit(x, y, n, dir) {
  for (const p of P) {
    if (n <= 0) break;
    if (p.alive) continue;
    const spread = 1.1, a = dir + (Math.random()-0.5)*spread;
    const sp = 90 + Math.random()*320;                    // vary EVERYTHING
    Object.assign(p, {alive:true, x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0, max:0.35+Math.random()*0.5, r:1.5+Math.random()*3.5,
      hue: Math.random()<0.25 ? 60 : 30});
    n--;
  }
}

// --- state ---
let trauma = 0, freeze = 0, flash = 0, squash = 0, last = performance.now(), t = 0;
const box = {x: W*0.5, y: H*0.5, w: 76, h: 76};
let nextHit = 0.6;

function impact() {
  trauma = Math.min(1, trauma + 0.75);
  freeze = 0.07;                                          // 70ms hit-stop
  flash = 1; squash = 1;
  emit(box.x - 44, box.y, 28, Math.PI);                   // cone toward impact normal
}

function update(dt) {
  t += dt;
  trauma = Math.max(0, trauma - dt * 1.4);
  flash  = Math.max(0, flash  - dt * 7);
  squash = Math.max(0, squash - dt * 4.5);
  for (const p of P) {
    if (!p.alive) continue;
    p.life += dt;
    if (p.life >= p.max) { p.alive = false; continue; }
    p.vy += 780 * dt;                                     // gravity
    const d = Math.pow(0.14, dt);                         // frame-rate-independent drag
    p.vx *= d; p.vy *= d;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

function draw() {
  const s = trauma * trauma;                              // squared falloff
  const ox = (noise(t*26)*2-1) * 20 * s;
  const oy = (noise(t*26+100)*2-1) * 20 * s;
  const rot = (noise(t*26+200)*2-1) * 0.028 * s;

  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 + ox, H/2 + oy); ctx.rotate(rot); ctx.translate(-W/2, -H/2);

  // the struck body: squash on impact, conserving volume
  const k = squash * 0.32;
  const bw = box.w * (1 - k), bh = box.h * (1 + k*0.8);
  ctx.fillStyle = flash > 0.02 ? `oklch(${88 + flash*8}% 0.06 60)` : 'oklch(64% 0.13 265)';
  ctx.beginPath();
  ctx.roundRect(box.x - bw/2, box.y - bh/2, bw, bh, 10);
  ctx.fill();

  for (const p of P) {
    if (!p.alive) continue;
    const u = p.life / p.max, a = (1-u)*(1-u);            // quadratic fade reads better
    ctx.globalAlpha = a;
    ctx.fillStyle = `oklch(${72 + p.hue*0.1}% 0.16 ${p.hue})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1-u*0.6), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function frame(now) {
  let dt = (now - last)/1000; last = now;
  dt = Math.min(dt, 1/30);                                // clamp: spikes explode springs
  if (freeze > 0) { freeze -= dt; dt *= 0.05; }           // near-freeze, not a true stop
  nextHit -= dt;
  if (nextHit <= 0) { impact(); nextHit = 1.15; }
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
