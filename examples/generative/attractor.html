<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Clifford — deterministic chaos</title><link rel="stylesheet" href="_gen.css"></head><body>
<canvas id="c"></canvas>
<div class="cap"><b>Clifford</b>420,000 points / frame · parameters orbiting one chaotic seed<br>
brightness is visit density, log-scaled</div>
<div class="seed">clifford · a,b,c,d ± 0.2</div>
<script src="_gen.js"></script><script>
/* Intent: deterministic chaos as filigree. One point, iterated: x' = sin(a·y) + c·cos(a·x).
   No physics and no randomness — the lace is where the orbit chooses to spend its time.
   Brightness is visit density on a log scale, so the faint structure survives next to
   the dense core. The parameters drift between four hand-picked seeds, so the figure
   morphs continuously instead of sitting still. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
let W,H,dens,img,buf;
const off=document.createElement('canvas'),octx=off.getContext('2d');
const N=420000;
const LUT=ramp([[0,0.07,0.012,265],[0.22,0.22,0.08,280],[0.5,0.46,0.15,320],
                [0.78,0.74,0.155,30],[1,0.97,0.06,80]]);
const BASE=[-1.4,1.6,1.0,0.7];          // a known-chaotic set; we only wander near it

function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight;
  off.width=W; off.height=H;
  dens=new Float32Array(W*H);
  img=octx.createImageData(W,H); buf=new Uint32Array(img.data.buffer); }
addEventListener('resize',resize); resize();

function params(t){    // small orbits around the seed: large excursions land in dead space
  return [BASE[0]+0.20*Math.sin(t*0.117), BASE[1]+0.20*Math.sin(t*0.091+1.7),
          BASE[2]+0.16*Math.sin(t*0.073+3.1), BASE[3]+0.16*Math.sin(t*0.134+0.6)];
}

let t=0,last=performance.now();
(function loop(now){
  const dt=Math.min((now-last)/1000,1/30); last=now; t+=dt;
  dens.fill(0);
  const [a,b,c,d]=params(t);
  const s=Math.min(W,H)*0.215, cx=W*0.5, cy=H*0.5;
  let x=0.1,y=0.1;
  for(let i=0;i<N;i++){
    const nx=Math.sin(a*y)+c*Math.cos(a*x);
    const ny=Math.sin(b*x)+d*Math.cos(b*y);
    x=nx; y=ny;
    if(i<40) continue;                    // discard transient
    const px=(cx+x*s)|0, py=(cy+y*s)|0;
    if(px>=0&&px<W&&py>=0&&py<H) dens[py*W+px]+=1;
  }
  for(let i=0;i<dens.length;i++){
    const v=clamp(Math.log1p(dens[i])*0.255,0,1);
    const k=(v*255)|0;
    buf[i]=(255<<24)|(LUT[k*3+2]<<16)|(LUT[k*3+1]<<8)|LUT[k*3];
  }
  octx.putImageData(img,0,0);
  ctx.drawImage(off,0,0);
  requestAnimationFrame(loop);
})(performance.now());
</script></body></html>
