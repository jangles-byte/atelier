<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chart</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 40px; }
  .wrap { width: 720px; }
  h2 { font-size: 18px; text-align: center; font-weight: bold; margin: 0 0 20px; }
  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 16px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; display: inline-block; }
</style></head>
<body>
<div class="wrap">
  <h2>Monthly Active Users by Plan</h2>
  <svg width="720" height="360" viewBox="0 0 720 360">
    <!-- gridlines -->
    <g stroke="#000000" stroke-width="1">
      <line x1="60" y1="300" x2="700" y2="300"/>
      <line x1="60" y1="240" x2="700" y2="240"/>
      <line x1="60" y1="180" x2="700" y2="180"/>
      <line x1="60" y1="120" x2="700" y2="120"/>
      <line x1="60" y1="60"  x2="700" y2="60"/>
    </g>
    <!-- y labels -->
    <g font-size="11" fill="#000" text-anchor="end" font-family="Arial">
      <text x="54" y="304">0</text>
      <text x="54" y="244">5000</text>
      <text x="54" y="184">10000</text>
      <text x="54" y="124">15000</text>
      <text x="54" y="64">20000</text>
    </g>
    <!-- bars: 3 series x 5 months -->
    <g>
      <!-- Jan -->
      <rect x="80"  y="252" width="24" height="48"  fill="#1f77b4"/>
      <rect x="106" y="228" width="24" height="72"  fill="#ff7f0e"/>
      <rect x="132" y="276" width="24" height="24"  fill="#2ca02c"/>
      <!-- Feb -->
      <rect x="204" y="240" width="24" height="60"  fill="#1f77b4"/>
      <rect x="230" y="204" width="24" height="96"  fill="#ff7f0e"/>
      <rect x="256" y="270" width="24" height="30"  fill="#2ca02c"/>
      <!-- Mar -->
      <rect x="328" y="222" width="24" height="78"  fill="#1f77b4"/>
      <rect x="354" y="168" width="24" height="132" fill="#ff7f0e"/>
      <rect x="380" y="264" width="24" height="36"  fill="#2ca02c"/>
      <!-- Apr -->
      <rect x="452" y="210" width="24" height="90"  fill="#1f77b4"/>
      <rect x="478" y="132" width="24" height="168" fill="#ff7f0e"/>
      <rect x="504" y="258" width="24" height="42"  fill="#2ca02c"/>
      <!-- May -->
      <rect x="576" y="192" width="24" height="108" fill="#1f77b4"/>
      <rect x="602" y="72"  width="24" height="228" fill="#ff7f0e"/>
      <rect x="628" y="252" width="24" height="48"  fill="#2ca02c"/>
    </g>
    <!-- x labels -->
    <g font-size="11" fill="#000" text-anchor="middle" font-family="Arial">
      <text x="118" y="320">Jan</text>
      <text x="242" y="320">Feb</text>
      <text x="366" y="320">Mar</text>
      <text x="490" y="320">Apr</text>
      <text x="614" y="320">May</text>
    </g>
  </svg>
  <div class="legend">
    <span><i class="sw" style="background:#1f77b4"></i>Free</span>
    <span><i class="sw" style="background:#ff7f0e"></i>Pro</span>
    <span><i class="sw" style="background:#2ca02c"></i>Enterprise</span>
  </div>
</div>
</body></html>
