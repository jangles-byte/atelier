<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Progress & pending</title>
<link rel="stylesheet" href="_base.css"><style>.exp{display:grid;gap:16px;max-width:400px;margin:6px auto 0}
.job{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line)}
.job .cv{width:38px;height:38px;border-radius:8px}
.job b{font-size:12.5px;font-weight:600}.job small{display:block;font-size:11px;color:var(--faint)}
.bar2{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:7px;width:190px}
.fill{height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.ind{height:100%;width:36%;background:var(--ok);border-radius:99px;animation:sl 1.2s var(--out) infinite}
@keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}
.btn{width:132px;display:grid;place-items:center;margin:0 auto}
.sp{width:14px;height:14px;border:2px solid oklch(18% .04 330/.35);border-top-color:oklch(18% .04 330);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}</style></head><body>
<div class="app"><div class="bar"><h1>Export</h1><div class="grow"></div>
<span class="pill">2 jobs</span></div><div class="body"><div class="exp">
<div class="job"><div class="cv c2"></div><div><b>Solar Bloom</b>
<small>bouncing · 24-bit</small><div class="bar2"><div class="fill" id="f"></div></div></div></div>
<div class="job"><div class="cv c5"></div><div><b>Umbra</b>
<small>uploading · unknown size</small><div class="bar2"><div class="ind"></div></div></div></div>
<button class="btn" id="b">Export all</button></div></div></div>
<div class="spec">determinate = <b>linear</b>, the one honest use · indeterminate loops <b>1.2s</b> · button holds its width</div>
<script src="_loop.js"></script><script>const f=$("#f"),b=$("#b");
cycle([[400,()=>{b.innerHTML='<span class="sp"></span>';
   f.style.transition="transform 2400ms linear";f.style.transform="scaleX(1)"}],
      [2900,()=>b.textContent="Done"],
      [3700,()=>{b.textContent="Export all";f.style.transition="none";f.style.transform="scaleX(0)"}]],4700)</script></body></html>
