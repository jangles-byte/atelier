<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Accordion</title>
<link rel="stylesheet" href="_base.css"><style>.sec{border:1px solid var(--line);border-radius:11px;background:var(--panel);
  overflow:hidden;margin-bottom:9px}
.hd{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer}
.hd .cv{width:30px;height:30px;border-radius:7px}
.hd b{font-size:12.5px;font-weight:600}.hd small{display:block;font-size:11px;color:var(--faint)}
.chev{margin-left:auto;color:var(--faint);font-size:11px;
  transition:transform 300ms var(--out) 80ms}
.open .chev{transform:rotate(180deg)}
.pan{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--out)}
.open + .pan{grid-template-rows:1fr}
.pan > div{overflow:hidden}
.pan .in{padding:0 14px 13px 55px}
.tk{display:flex;justify-content:space-between;padding:6px 0;font-size:11.5px;
  color:var(--muted);border-top:1px solid var(--line)}
.tk i{font-style:normal;font-family:ui-monospace,monospace;color:var(--faint)}</style></head><body>
<div class="app"><div class="bar"><h1>Solar Bloom</h1><div class="grow"></div>
<span class="pill">24 takes</span></div><div class="body">
<div class="sec"><div class="hd" id="h"><div class="cv c2"></div>
<div><b>Session takes</b><small>recorded over three evenings</small></div>
<span class="chev">▾</span></div>
<div class="pan"><div><div class="in">
<div class="tk"><span>Take 14 — keeper</span><i>04:12</i></div>
<div class="tk"><span>Take 09 — alt bridge</span><i>03:58</i></div>
<div class="tk"><span>Take 03 — scratch</span><i>04:41</i></div></div></div></div></div>
<div class="sec"><div class="hd"><div class="cv c5"></div>
<div><b>Bounces</b><small>3 masters</small></div><span class="chev">▾</span></div>
<div class="pan"><div><div class="in"></div></div></div></div>
</div></div>
<div class="spec">grid-template-rows <b>0fr → 1fr</b> · <b>300ms ease-out</b> · chevron trails <b>80ms</b></div>
<script src="_loop.js"></script><script>const h=$("#h");
cycle([[500,()=>h.classList.add("open")],[2500,()=>h.classList.remove("open")]],3900)</script></body></html>
