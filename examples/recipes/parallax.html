<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Parallax</title>
<link rel="stylesheet" href="_base.css"><style>.body{padding:0;overflow:hidden}
.hero{position:relative;height:100%;overflow:hidden}
.lyr{position:absolute;inset:-70px;will-change:transform}
.l1{background:radial-gradient(58% 52% at 26% 40%,oklch(46% .16 320/.75),transparent 68%)}
.l2{background:radial-gradient(52% 46% at 74% 62%,oklch(52% .15 208/.62),transparent 70%)}
.l3{background:radial-gradient(40% 38% at 52% 24%,oklch(62% .14 62/.4),transparent 72%)}
.fg{position:relative;z-index:2;padding:34px 26px}
.fg h2{font-size:29px;letter-spacing:-.03em}
.fg p{margin-top:8px;max-width:34ch}</style></head><body>
<div class="app"><div class="bar"><h1>Ember</h1><div class="grow"></div>
<span class="pill">feature</span></div><div class="body"><div class="hero">
<div class="lyr l1" id="a"></div><div class="lyr l2" id="b"></div><div class="lyr l3" id="c"></div>
<div class="fg" id="d"><h2>Ember</h2><p class="dim">Twenty-one takes cut down to nine
minutes, recorded in a room with the windows open.</p></div>
</div></div></div>
<div class="spec">back <b>18%</b> · mid <b>31%</b> of scroll · transforms only · off entirely under reduced-motion</div>
<script src="_loop.js"></script><script>const a=$("#a"),b=$("#b"),c=$("#c"),d=$("#d");let cur=0,raf;
function at(p){a.style.transform=`translateY(${-p*40}px)`;
  b.style.transform=`translateY(${-p*70}px)`;
  c.style.transform=`translateY(${-p*22}px)`;
  d.style.transform=`translateY(${-p*118}px)`;d.style.opacity=1-p*0.75;}
at(0);
function run(to,ms){cancelAnimationFrame(raf);const t0=performance.now(),from=cur;
  (function s(n){const t=Math.min(1,(n-t0)/ms),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
   cur=from+(to-from)*e;at(cur);if(t<1)raf=requestAnimationFrame(s);})(t0);}
cycle([[500,()=>run(1,1900)],[2900,()=>run(0,1300)]],4600)</script></body></html>
