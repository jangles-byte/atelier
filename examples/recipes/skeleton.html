<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Skeleton → content</title>
<link rel="stylesheet" href="_base.css"><style>.box{width:330px}
.sk{height:14px;border-radius:5px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--panel) 25%,var(--raise) 37%,var(--panel) 63%);
  background-size:400% 100%;animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{to{background-position:-135% 0}}
.real{transition:opacity 150ms var(--out)}
.hide{opacity:0;position:absolute;pointer-events:none}</style></head><body>
<div class="spec">sweep <b>1.4s</b> · swap <b>150ms crossfade</b> · only shown after 200ms of waiting</div>
<div class="stage"><div class="box">
<div id="sk"><div class="sk" style="width:60%"></div><div class="sk"></div>
<div class="sk" style="width:80%"></div><div class="sk" style="width:45%"></div></div>
<div id="rl" class="real hide"><h4 style="margin-bottom:8px">Build 4127</h4>
<small>Compiled 1,482 modules in 41s. Uploaded 12.4 MB to the edge across 38 POPs
with no cache misses on the critical path.</small></div>
</div></div>
<script src="_loop.js"></script><script>const sk=$("#sk"),rl=$("#rl");
cycle([[1600,()=>{sk.classList.add("hide");rl.classList.remove("hide")}],
       [3200,()=>{rl.classList.add("hide");sk.classList.remove("hide")}]],4400)</script></body></html>
