<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Skeleton → content</title>
<link rel="stylesheet" href="_base.css"><style>.sk{background:linear-gradient(90deg,var(--panel) 25%,var(--raise) 38%,var(--panel) 62%);
  background-size:400% 100%;animation:sw 1.4s ease-in-out infinite;border-radius:10px}
@keyframes sw{to{background-position:-135% 0}}
.sk.line{height:11px;border-radius:5px;margin-top:9px}
.sk.sq{aspect-ratio:1;width:100%}
.fade{transition:opacity 150ms var(--out)}
.gone{opacity:0;position:absolute;inset:20px;pointer-events:none}</style></head><body>
<div class="app"><div class="bar"><h1>Library</h1><div class="grow"></div>
<span class="pill" id="p">loading</span></div>
<div class="body" style="position:relative">
<div class="grid fade" id="sk">
<div><div class="sk sq"></div><div class="sk line" style="width:70%"></div><div class="sk line" style="width:44%"></div></div>
<div><div class="sk sq"></div><div class="sk line" style="width:82%"></div><div class="sk line" style="width:38%"></div></div>
<div><div class="sk sq"></div><div class="sk line" style="width:64%"></div><div class="sk line" style="width:50%"></div></div>
<div><div class="sk sq"></div><div class="sk line" style="width:76%"></div><div class="sk line" style="width:42%"></div></div>
</div>
<div class="grid fade gone" id="rl">
<div class="tile"><div class="cv c1"></div><b>Nocturne</b><small>18 takes</small></div>
<div class="tile"><div class="cv c2"></div><b>Solar Bloom</b><small>24 takes</small></div>
<div class="tile"><div class="cv c3"></div><b>Deep Field</b><small>11 takes</small></div>
<div class="tile"><div class="cv c4"></div><b>Verdant</b><small>9 takes</small></div>
</div></div></div>
<div class="spec">sweep <b>1.4s</b> · swap <b>150ms crossfade</b> · geometry matches, so nothing reflows</div>
<script src="_loop.js"></script><script>const sk=$("#sk"),rl=$("#rl"),p=$("#p");
cycle([[1700,()=>{sk.classList.add("gone");rl.classList.remove("gone");p.textContent="62 sessions"}],
       [3500,()=>{rl.classList.add("gone");sk.classList.remove("gone");p.textContent="loading"}]],4700)</script></body></html>
