<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Tabs</title>
<link rel="stylesheet" href="_base.css"><style>.tabs{width:360px}
.list{position:relative;display:flex;gap:26px;border-bottom:1px solid var(--rule);padding-bottom:11px}
.list b{font-size:13.5px;font-weight:500;color:var(--faint);cursor:pointer;transition:color 200ms var(--out)}
.list b.on{color:var(--text);font-weight:600}
.ind{position:absolute;bottom:-1px;left:0;height:2px;width:60px;background:var(--accent);
  transition:transform 250ms var(--out),width 250ms var(--out)}
.body{margin-top:16px;color:var(--muted);font-size:13px;min-height:42px}
.body p{transition:opacity 150ms var(--out)}</style></head><body>
<div class="spec">indicator slides <b>250ms ease-out</b> · content crossfades <b>150ms</b></div>
<div class="stage"><div class="tabs">
<div class="list" id="l"><b class="on">Overview</b><b>Metrics</b><b>Logs</b>
<span class="ind" id="ind"></span></div>
<div class="body"><p id="p">Deployment 4127 is live in three regions.</p></div>
</div></div>
<script src="_loop.js"></script><script>const tabs=$$(".list b"),ind=$("#ind"),p=$("#p");
const TXT=["Deployment 4127 is live in three regions.",
           "p50 41ms · p95 118ms · 0 errors in the last hour.",
           "14,208 lines since the last deploy. No warnings."];
function go(i){tabs.forEach((t,j)=>t.classList.toggle("on",i===j));
  const r=tabs[i].getBoundingClientRect(),pr=$("#l").getBoundingClientRect();
  ind.style.width=r.width+"px";ind.style.transform=`translateX(${r.left-pr.left}px)`;
  p.style.opacity=0;setTimeout(()=>{p.textContent=TXT[i];p.style.opacity=1},150);}
go(0);
cycle([[700,()=>go(1)],[1900,()=>go(2)],[3100,()=>go(0)]],4300)</script></body></html>
