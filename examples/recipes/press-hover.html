<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Press & hover</title>
<link rel="stylesheet" href="_base.css"><style>.tile .cv{transition:transform 130ms var(--back),box-shadow 130ms var(--out),
  filter 130ms var(--out)}
.tile b,.tile small{transition:color 130ms var(--out)}
.tile.h .cv{transform:translateY(-4px) scale(1.014);box-shadow:0 20px 34px -16px rgb(0 0 0/.9);
  filter:saturate(1.12) brightness(1.06)}
.tile.h b{color:var(--accent)}
.tile.p .cv{transform:translateY(-1px) scale(.985);transition-duration:80ms}</style></head><body>
<div class="app"><div class="bar"><h1>Library</h1><div class="grow"></div>
<span class="pill">62 sessions</span></div><div class="body"><div class="grid">
<div class="tile"><div class="cv c1"></div><b>Nocturne</b><small>18 takes</small></div>
<div class="tile"><div class="cv c2"></div><b>Solar Bloom</b><small>24 takes</small></div>
<div class="tile"><div class="cv c3"></div><b>Deep Field</b><small>11 takes</small></div>
<div class="tile"><div class="cv c4"></div><b>Verdant</b><small>9 takes</small></div></div></div></div>
<div class="spec">press <b>80ms</b> · release <b>130ms ease-back</b> · lift + shadow + edge, never opacity</div>
<script src="_loop.js"></script><script>const t=$$(".tile")[1];
cycle([[350,()=>t.classList.add("h")],[950,()=>t.classList.add("p")],
       [1100,()=>t.classList.remove("p")],[1900,()=>t.classList.remove("h")]],2700)</script></body></html>
