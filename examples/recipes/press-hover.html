<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Press & hover</title>
<link rel="stylesheet" href="_base.css"><style>.btn,.card{transition:transform 130ms var(--back),background-color 130ms var(--out),
  box-shadow 130ms var(--out),border-color 130ms var(--out)}
.btn.h{background:oklch(84% 0.13 265);transform:translateY(-1px);box-shadow:0 6px 16px rgb(0 0 0/.4)}
.btn.p{transform:scale(.96) translateY(0);transition-duration:80ms}
.card{width:190px}.card.h{transform:translateY(-2px) scale(1.006);border-color:oklch(45% 0.06 265)}
.card.p{transform:scale(.984);transition-duration:80ms}</style></head><body>
<div class="spec">press <b>80ms</b> · release <b>130ms ease-back</b> · lift + shadow + colour</div>
<div class="stage"><div class="row" style="gap:26px">
<button class="btn" id="b">Deploy</button>
<div class="card" id="c"><h4>Build 4127</h4><small>ready to ship</small></div>
</div></div>
<script src="_loop.js"></script><script>const b=$("#b"),c=$("#c");
cycle([[300,()=>{b.classList.add("h");c.classList.add("h")}],
       [900,()=>{b.classList.add("p");c.classList.add("p")}],
       [1050,()=>{b.classList.remove("p");c.classList.remove("p")}],
       [1700,()=>{b.classList.remove("h");c.classList.remove("h")}]],2600)</script></body></html>
