<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Toast stack</title>
<link rel="stylesheet" href="_base.css"><style>.stack{position:absolute;right:18px;bottom:16px;z-index:5;display:flex;
  flex-direction:column;gap:9px;align-items:flex-end}
.t{display:flex;align-items:center;gap:10px;width:238px;padding:10px 13px;border-radius:11px;
  background:linear-gradient(160deg,var(--raise),var(--panel));border:1px solid var(--edge);
  box-shadow:var(--shadow)}
.t .cv{width:26px;height:26px;border-radius:6px}
.t b{font-size:12px;font-weight:600}.t small{display:block;font-size:10.5px;color:var(--faint)}</style></head><body>
<div class="app"><div class="bar"><h1>Library</h1><div class="grow"></div>
<span class="pill">uploading</span></div><div class="body"><div class="grid">
<div class="tile"><div class="cv c1"></div><b>Nocturne</b><small>18 takes</small></div>
<div class="tile"><div class="cv c2"></div><b>Solar Bloom</b><small>24 takes</small></div>
<div class="tile"><div class="cv c3"></div><b>Deep Field</b><small>11 takes</small></div>
<div class="tile"><div class="cv c4"></div><b>Verdant</b><small>9 takes</small></div></div></div>
<div class="stack" id="s"></div></div>
<div class="spec">enter <b>250ms</b> · exit <b>200ms</b> · survivors FLIP up <b>220ms</b>, never snap</div>
<script src="_loop.js"></script><script>const s=$("#s"),M=[["c2","Solar Bloom","master uploaded · 41s"],
  ["c3","Deep Field","bounced to 24-bit"],["c6","Ember","3 takes synced"]];
function add(i){const d=document.createElement("div");d.className="t";
  d.innerHTML=`<div class="cv ${M[i][0]}"></div><div><b>${M[i][1]}</b><small>${M[i][2]}</small></div>`;
  s.appendChild(d);d.animate([{opacity:0,transform:"translateY(14px) scale(.97)"},
    {opacity:1,transform:"none"}],{duration:250,easing:"cubic-bezier(0.22,1,0.36,1)",fill:"both"});}
function drop(){const dead=s.firstElementChild;if(!dead)return;
  const first=[...s.children].map(e=>e.getBoundingClientRect().top);
  dead.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(16px)"}],
   {duration:200,easing:"cubic-bezier(0.55,0,1,0.45)",fill:"both"}).onfinish=()=>{dead.remove();
   [...s.children].forEach((e,i)=>{const dy=first[i+1]-e.getBoundingClientRect().top;
     if(dy)e.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],
       {duration:220,easing:"cubic-bezier(0.22,1,0.36,1)"});});};}
cycle([[250,()=>add(0)],[650,()=>add(1)],[1050,()=>add(2)],
       [2200,drop],[2800,drop],[3400,drop]],4500)</script></body></html>
