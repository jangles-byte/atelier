<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>List reorder (FLIP)</title>
<link rel="stylesheet" href="_base.css"><style>.r{transition:border-color 200ms var(--out)}</style></head><body>
<div class="app"><div class="bar"><h1>Queue</h1><div class="grow"></div>
<span class="pill">re-sorting</span></div><div class="body"><div class="rows" id="u"></div></div></div>
<div class="spec">reorder <b>300ms ease-out</b>, moving together so the swap reads as one event</div>
<script src="_loop.js"></script><script>const u=$("#u");
let items=[["c2","Solar Bloom","24-bit · 96kHz","04:12"],["c1","Nocturne","24-bit · 48kHz","03:26"],
 ["c3","Deep Field","32-bit float","05:44"],["c5","Umbra","24-bit · 48kHz","03:38"],
 ["c6","Ember","24-bit · 96kHz","04:57"]];
function paint(){u.innerHTML="";items.forEach(([c,n,m,t])=>{const d=document.createElement("div");
  d.className="r";d.dataset.k=n;
  d.innerHTML=`<div class="cv ${c}"></div><div><b>${n}</b><small>${m}</small></div><i>${t}</i>`;
  u.appendChild(d);});}
function flip(mut){const first=new Map([...u.children].map(e=>[e.dataset.k,e.getBoundingClientRect()]));
  mut();
  [...u.children].forEach(e=>{const a=first.get(e.dataset.k);if(!a)return;
    const dy=a.top-e.getBoundingClientRect().top;if(!dy)return;
    e.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],
      {duration:300,easing:"cubic-bezier(0.22,1,0.36,1)"});});}
paint();
cycle([[700,()=>flip(()=>{items.unshift(items.pop());paint();})],
       [2100,()=>flip(()=>{items.sort((a,b)=>a[3]<b[3]?1:-1);paint();})],
       [3400,()=>flip(()=>{items.reverse();paint();})]],4700)</script></body></html>
