<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Chase camera</title>
<link rel="stylesheet" href="_base.css"><style>.win{width:440px;height:190px;overflow:hidden;border-radius:12px;border:1px solid var(--rule);
  background:oklch(13% .014 265);position:relative}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(oklch(24% .02 265) 1px,transparent 1px),
  linear-gradient(90deg,oklch(24% .02 265) 1px,transparent 1px);background-size:44px 44px}
.act{position:absolute;top:74px;left:0;width:30px;height:30px;border-radius:9px;background:var(--accent)}
.tag{position:absolute;left:14px;bottom:10px;font:500 10.5px/1 ui-monospace,monospace;color:var(--faint)}</style></head><body>
<div class="spec"><b>pos = target + (pos−target)·e^(−k·dt)</b> · frame-rate independent · k=6 loose, k=15 tight</div>
<div class="stage"><div class="win">
<div class="grid" id="g"></div><div class="act" id="a"></div>
<div class="tag">camera k = 6</div></div></div>
<script src="_loop.js"></script><script>const g=$("#g"),a=$("#a");let ax=40,cam=0,dir=1,last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,1/30);last=now;
  ax+=dir*260*dt; if(ax>760){dir=-1} if(ax<40){dir=1}
  cam = ax-190 + (cam-(ax-190))*Math.exp(-6*dt);   /* exponential smoothing */
  g.style.transform=`translateX(${-cam}px)`;
  a.style.transform=`translateX(${ax-cam}px)`;
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);</script></body></html>
