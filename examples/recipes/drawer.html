<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Drawer</title>
<link rel="stylesheet" href="_base.css"><style>.dr{position:absolute;top:0;left:0;bottom:0;width:212px;z-index:4;padding:18px;
  background:linear-gradient(150deg,var(--raise),var(--panel));border-right:1px solid var(--edge);
  transform:translateX(-100%);transition:transform 450ms var(--out);box-shadow:var(--shadow)}
.on .dr{transform:none}
.closing .dr{transition-duration:360ms;transition-timing-function:var(--in)}
.scrim{position:absolute;inset:0;background:oklch(8% .01 275/.5);opacity:0;z-index:3;
  transition:opacity 450ms var(--out)}
.on .scrim{opacity:1}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  font-size:12.5px;color:var(--muted)}
.nav.sel{background:var(--raise);color:var(--text);font-weight:600}
.nav span{width:7px;height:7px;border-radius:2px;background:var(--faint)}
.nav.sel span{background:var(--accent)}</style></head><body>
<div class="app" id="a"><div class="bar"><h1>Library</h1><div class="grow"></div>
<span class="pill">62 sessions</span></div><div class="body"><div class="grid">
<div class="tile"><div class="cv c1"></div><b>Nocturne</b><small>18 takes</small></div>
<div class="tile"><div class="cv c2"></div><b>Solar Bloom</b><small>24 takes</small></div>
<div class="tile"><div class="cv c3"></div><b>Deep Field</b><small>11 takes</small></div>
<div class="tile"><div class="cv c4"></div><b>Verdant</b><small>9 takes</small></div></div></div>
<div class="scrim"></div>
<div class="dr"><h2 style="font-size:15px;margin-bottom:14px">Studio</h2>
<div class="nav sel"><span></span>All sessions</div><div class="nav"><span></span>Recent</div>
<div class="nav"><span></span>Masters</div><div class="nav"><span></span>Archive</div>
<div class="nav"><span></span>Trash</div></div></div>
<div class="spec">open <b>450ms ease-out</b> · close <b>360ms ease-in</b> · travels from its own edge</div>
<script src="_loop.js"></script><script>const a=$("#a");
cycle([[500,()=>{a.classList.remove("closing");a.classList.add("on")}],
       [2400,()=>{a.classList.add("closing");a.classList.remove("on")}]],3800)</script></body></html>
